repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: black-check
        name: Black check
        entry: black --check .
        language: system
        pass_filenames: false
        always_run: true
